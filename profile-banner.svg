<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">91akang</title>
  <desc id="desc">把复杂运营，做成简单可靠的软件。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.58" stop-color="#0B2330"/>
      <stop offset="1" stop-color="#10363B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#27D3C2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#27D3C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BE6D7"/>
      <stop offset="1" stop-color="#FFB44A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B9D5D7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <g transform="translate(184 180)" fill="none">
