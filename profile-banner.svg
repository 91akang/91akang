    <text x="0" y="112" fill="#F3FBFB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="740" letter-spacing="-2">91akang</text>
    <text x="0" y="166" fill="#D6E7E8" font-family="'PingFang SC', 'Microsoft YaHei', Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">把复杂运营，做成简单可靠的软件。</text>
    <line x1="0" y1="204" x2="682" y2="204" stroke="#B9D5D7" stroke-opacity="0.2"/>
