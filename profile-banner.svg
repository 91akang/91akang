    <path d="M0-116V116M-116 0H116" stroke="#C9F6F0" stroke-opacity="0.09"/>
    <path d="M0 0L80-84A116 116 0 0 1 112 31Z" fill="#27D3C2" fill-opacity="0.08" stroke="#48DDCF" stroke-opacity="0.45"/>
    <path d="M0 0L78-82" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="78" cy="-82" r="7" fill="#FFB44A" stroke="#FFF0D6" stroke-width="2" filter="url(#softGlow)"/>
    <circle r="8" fill="#5BE6D7"/>
    <path d="M-67 60C-32 88 25 88 68 58" stroke="#5BE6D7" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
